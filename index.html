<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>OCR Mailer</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2c2116" />
<style>
  @font-face {
    font-family: 'DM Sans';
    src: local('DM Sans');
  }

  :root {
    --beige: #f5efe6;
    --cream: #ede4d4;
    --brown: #2c2116;
    --terracotta: #b5451b;
    --green: #3a6b4a;
    --red: #a8331f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: var(--brown);
    color: var(--beige);
    height: 100vh;
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--brown);
    border-bottom: 1px solid rgba(245,239,230,0.1);
    z-index: 10;
  }

  header h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }

  header h1 span { color: var(--terracotta); }

  #status-pill {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(245,239,230,0.08);
    color: var(--beige);
    opacity: 0.7;
  }

  #camera-view {
    position: relative;
    flex: 1;
    background: #000;
    overflow: hidden;
  }

  #camera-view video, #camera-view canvas#capture-canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #captured-preview {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
    background: #000;
  }

  #crop-stage {
    position: absolute;
    inset: 0;
    display: none;
  }

  #crop-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: #000;
    pointer-events: none;
    user-select: none;
  }

  #crop-box {
    position: absolute;
    border: 2px solid var(--terracotta);
    background: rgba(181,69,27,0.12);
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
    touch-action: none;
  }

  .crop-handle {
    position: absolute;
    width: 26px;
    height: 26px;
    background: var(--terracotta);
    border: 2px solid var(--beige);
    border-radius: 50%;
    touch-action: none;
  }

  .crop-handle.tl { top: -13px; left: -13px; cursor: nwse-resize; }
  .crop-handle.tr { top: -13px; right: -13px; cursor: nesw-resize; }
  .crop-handle.bl { bottom: -13px; left: -13px; cursor: nesw-resize; }
  .crop-handle.br { bottom: -13px; right: -13px; cursor: nwse-resize; }

  #crop-hint {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(44,33,22,0.85);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    text-align: center;
    max-width: 85%;
    z-index: 5;
  }

  #crop-controls {
    padding: 18px 18px 26px;
    background: var(--brown);
    display: none;
    gap: 12px;
  }

  .frame-guide {
    position: absolute;
    top: 8%;
    left: 6%;
    right: 6%;
    bottom: 18%;
    border: 2px dashed rgba(245,239,230,0.4);
    border-radius: 12px;
    pointer-events: none;
  }

  #overlay-msg {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(44,33,22,0.85);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    text-align: center;
    max-width: 85%;
  }

  #controls {
    padding: 18px 18px 26px;
    background: var(--brown);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    position: relative;
  }

  #shutter {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: var(--beige);
    border: 4px solid var(--terracotta);
    cursor: pointer;
  }

  #shutter:active { transform: scale(0.94); }

  .secondary-btn {
    background: transparent;
    border: 1px solid rgba(245,239,230,0.3);
    color: var(--beige);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .primary-btn {
    background: var(--terracotta);
    border: none;
    color: var(--beige);
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    flex: 1;
  }

  .primary-btn:disabled, .secondary-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  #result-panel {
    display: none;
    flex-direction: column;
    flex: 1;
    background: var(--beige);
    color: var(--brown);
    overflow: hidden;
  }

  #result-header {
    padding: 16px 18px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #result-header h2 {
    font-size: 15px;
    margin: 0;
    font-weight: 700;
  }

  #confidence-badge {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
  }

  #ocr-text {
    flex: 1;
    margin: 0 18px;
    padding: 14px;
    background: var(--cream);
    border-radius: 10px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--brown);
    resize: none;
    overflow-y: auto;
  }

  #result-actions {
    padding: 16px 18px 26px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  #result-actions .primary-btn,
  #result-actions .secondary-btn {
    flex: 1;
    min-width: 110px;
    padding: 13px 14px;
    font-size: 13px;
  }

  #send-status {
    text-align: center;
    font-size: 13px;
    padding: 8px;
    margin: 0 18px;
  }

  .ocr-progress-wrap {
    position: absolute;
    inset: 0;
    background: rgba(44,33,22,0.92);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--beige);
    gap: 14px;
    z-index: 20;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(245,239,230,0.25);
    border-top-color: var(--terracotta);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #progress-label { font-size: 13px; opacity: 0.85; }
  #progress-pct { font-size: 22px; font-weight: 700; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>OCR<span>Mailer</span></h1>
    <div id="status-pill">starting camera…</div>
  </header>

  <div id="camera-view">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="capture-canvas" class="hidden"></canvas>
    <img id="captured-preview" alt="Captured document" />

    <div id="crop-stage">
      <img id="crop-image" alt="Crop selection" />
      <div id="crop-hint">Drag corners to box in just the text you want read</div>
      <div id="crop-box">
        <div class="crop-handle tl"></div>
        <div class="crop-handle tr"></div>
        <div class="crop-handle bl"></div>
        <div class="crop-handle br"></div>
      </div>
    </div>

    <div class="frame-guide" id="frame-guide"></div>
    <div id="overlay-msg" class="hidden"></div>

    <div class="ocr-progress-wrap" id="ocr-progress">
      <div class="spinner"></div>
      <div id="progress-pct">0%</div>
      <div id="progress-label">Reading text…</div>
    </div>
  </div>

  <div id="controls">
    <button id="shutter" aria-label="Capture"></button>
  </div>

  <div id="crop-controls">
    <button class="secondary-btn" id="crop-cancel-btn">Retake photo</button>
    <button class="primary-btn" id="crop-confirm-btn">Read this area</button>
  </div>

  <div id="result-panel">
    <div id="result-header">
      <h2>Extracted text</h2>
      <span id="confidence-badge"></span>
    </div>
    <textarea id="ocr-text" spellcheck="false"></textarea>
    <div id="send-status"></div>
    <div id="result-actions">
      <button class="secondary-btn" id="retake-btn">Retake</button>
      <button class="secondary-btn" id="recrop-btn">Crop another area</button>
      <button class="primary-btn" id="send-btn">Send to email</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
